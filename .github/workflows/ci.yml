name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfreetype6-dev \
            libfontconfig1-dev \
            libwayland-dev \
            libxkbcommon-dev \
            cmake neovim

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test

      - name: Verify Neovim default mouse scrolling
        env:
          NVIM_LOG_FILE: ${{ runner.temp }}/nvim-test.log
        run: cargo test live_nvim_ -- --ignored --nocapture

  build-windows:
    runs-on: windows-latest
    env:
      # cmake クレートは新しい Visual Studio(18=2026相当)の generator 名を知らず
      # 自動判定に失敗する。Ninja を明示すれば VS バージョン非依存でビルドできる。
      CMAKE_GENERATOR: Ninja
      # 同梱 FreeType の CMakeLists が古い cmake_minimum_required を宣言しており、
      # 新しい CMake(4.x) が互換ポリシー不足で拒否する。最小ポリシーを指定して許可する。
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4

      # FreeType を cmake でソースビルドするため MSVC 開発環境(vcvars)を読み込む。
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test

      - name: Upload Windows development build
        uses: actions/upload-artifact@v4
        with:
          name: gototerm-windows-x64
          path: |
            target/release/gototerm.exe
            target/release/gototerm-hook.exe

      - name: Verify Vim copy and substitution on ConPTY
        timeout-minutes: 3
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'vim.zip'
          Invoke-WebRequest 'https://github.com/vim/vim-win32-installer/releases/download/v9.2.1172/gvim_9.2.1172_x64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne '03e37f348a0fe5ccc61e3e2d9ffa43d3a3d0e8068f14d6d17b241bee31b38626') { throw 'Vim archive checksum mismatch' }
          $extract = Join-Path $env:RUNNER_TEMP 'vim-test'
          Expand-Archive $archive $extract
          $env:GOTOTERM_TEST_VIM = (Get-ChildItem $extract -Filter vim.exe -Recurse | Select-Object -First 1).FullName
          if (-not $env:GOTOTERM_TEST_VIM) { throw 'vim.exe missing from official archive' }
          cargo test live_vim_ -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Neovim default mouse scrolling on ConPTY
        timeout-minutes: 3
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nvim.zip'
          Invoke-WebRequest 'https://github.com/neovim/neovim/releases/download/v0.12.6/nvim-win64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne '4e12b7103b601ffc8f25954b4da100f339faa73dccb69a5b135e897fa3d893ed') { throw 'Neovim archive checksum mismatch' }
          $extract = Join-Path $env:RUNNER_TEMP 'nvim-test'
          Expand-Archive $archive $extract
          $env:GOTOTERM_TEST_NVIM = Join-Path $extract 'nvim-win64/bin/nvim.exe'
          $env:NVIM_LOG_FILE = Join-Path $env:RUNNER_TEMP 'nvim-test.log'
          cargo test live_nvim_ -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
